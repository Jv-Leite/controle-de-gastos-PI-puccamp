<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Controle Financeiro</title>
  <link rel="stylesheet" href="../styles/variables.css">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


  <script src="../scripts/login.js" defer></script>
</head>


<body>

<div class="Registrar">

    <div class="esquerda">
        <h2>Planejamento <span style="color: rgb(0, 213, 0); font-weight:bolder;">simples</span>,<br> rotina financeira <br><span style="color:rgb(0, 213, 0); font-weight: bold;">sem estresse</span></h2>
        <div class="linha-verde"></div>
        <p>
        <span style="color: rgb(0, 213, 0); font-weight:bolder;">Registre</span> receitas e despesas,<br> <span style="color: rgb(0, 213, 0); font-weight:bolder;">Acompanhe</span> gastos por categoria<br> 
        <span style="color: rgb(0, 213, 0); font-weight:bolder;">Planeje</span> suas metas <br><b>em um só lugar.</b>
        </p>
        
    </div>

    <!--simbulin-->
    <div class="direita">
      <a href="../index.html" style="text-decoration: none;">
        <div class="logo-box">
        <span class="logo-conta">Conta</span>
        <div class="logo-linha-ai">
        <span class="logo-ai">Aí</span>
        <img src="../../../assets/img/icone.svg" alt="Símbolo" class="logo">
      </a>
    </div>
    
</div>
        <br>
        <p>Entre ou cadastre-se com:</p>
<div class="botoes-sociais">
  <!-- Google -->
  <button id="btn-google" type="button" class="btn-google">
    <svg viewBox="0 0 24 24" width="20" height="20">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>  
    <span>Google</span>
  </button>
</div>

        <div class="divisão">
            <span>ou</span>
        </div>

        <button id="cadastrar-email" class="cadastrar-email">Cadastrar com E-mail</button>

        <button id="entrar" class="ja-tenho-conta"><i class="fa-solid fa-right-to-bracket"></i> Já tenho conta - Entrar</button>

    </div>

</div>




<!--modal cadastro-->

<div class="modal-cadastro" id="modal-cadastro">
  <div class="modal-conteudo">
    <button class="modal-fechar" id="btn-fechar"><i class="fa-solid fa-xmark fa-wag"></i></button>
    
    <h2>Criar Conta</h2>
    <p>Preencha os dados abaixo criar sua conta</p>

    <!--nome-->
    <form id="form-cadastro" novalidate>
      <div class="input-box">
        <label for="nome">Nome de Usuario</label>
        <div class="input-field">
          <input type="text" id="nome" name="nome" placeholder="Ex: Arthur">
          <i class="fa-solid fa-user"></i>
        </div>
        <span class="erro-msg" id="erro-nome"></span>
      </div>

      <!--email-->
      <div class="input-box">
        <label for="email">E-mail</label>
        <div class="input-field">
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <span class="erro-msg" id="erro-email"></span>
      </div>

      <!--senha-->
      <div class="input-box">
        <label for="senha">Senha</label>
        <div class="input-field">
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha">
          <i class="fa-solid fa-lock"></i>
        </div>
        <span class="erro-msg" id="erro-senha"></span>
      </div>

      <button type="submit" class="btn-submit">Criar minha conta</button>
    </form>
  </div>
</div>








<!--modal login-->

<div class="modal-login" id="modal-login">
  <div class="modal-conteudo">
    <button class="modal-fechar" id="btn-fechar-login"><i class="fa-solid fa-xmark fa-wag"></i></button>
    
    <h2>Acessar Conta</h2>
    <p>Digite seu e-mail e senha para entrar</p>

    <form id="form-login" novalidate>

      <!--email-->
      <div class="input-box">
        <label for="login-email">E-mail</label>
        <div class="input-field">
          <input type="email" id="login-email" name="email" placeholder="seuemail@exemplo.com"  >
          <i class="fa-solid fa-envelope"></i>
        </div>
        <span class="erro-msg" id="erro-login-email"></span>
      </div>

      <!--senha-->
      <div class="input-box">
        <label for="login-senha">Senha</label>
        <div class="input-field">
          <input type="password" id="login-senha" name="senha" placeholder="Sua senha"  >
          <i class="fa-solid fa-lock"></i>
        </div>
        <span class="erro-msg" id="erro-login-senha"></span>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar
      </button>
    </form>
  </div>
</div>



<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
